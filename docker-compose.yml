version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: retailmind_postgres
    environment:
      POSTGRES_DB: retailmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailmind_api_server
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=retailmind
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_password
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/run_app.py

  ml-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailmind_ml_worker
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy
    command: python scripts/run_experiments.py

volumes:
  postgres_data:
