# RetailMind-X Inventory Optimization Configuration
# Vaidsys Technologies Data Science Project 1

inventory:
  service_level: 0.95
  lead_time_days: 7
  lead_time_variance: 1.0
  holding_cost_rate: 0.20
  holding_cost_per_unit_year: 2.00
  ordering_cost_fixed: 50.00
  stockout_penalty_multiplier: 1.50
  working_days_per_year: 365

policy:
  review_period_days: 7
  safety_stock_formula: "king_normsinv"
  min_order_quantity: 1
  round_to_case_pack: false

targets:
  stockout_target_reduction_pct: 15.0
  overstock_target_reduction_pct: 10.0
  working_capital_reduction_pct: 12.0

abc_classification:
  class_a_revenue_pct: 0.70
  class_b_revenue_pct: 0.20
  class_c_revenue_pct: 0.10
